provider:
  name: openfaas
  gateway: http://afa49de75be884405914168c86482870-335240086.eu-west-2.elb.amazonaws.com:8080
functions:
  pigo-faceblur:
    lang: go
    handler: ./pigo-openfaas-faceblur
    image: mbilalce/face-blur:latest
    environment:
      input_mode: url
      output_mode: image
      content_type: image/jpeg
      read_timeout: 600s
      write_timeout: 600s
      exec_timeout: 600s
    labels:
      com.openfaas.scale.zero: 'false'
    limits:
      memory: 1024Mi
      cpu: 500m
    constraints:
    - beta.kubernetes.io/instance-type=c5a.large
