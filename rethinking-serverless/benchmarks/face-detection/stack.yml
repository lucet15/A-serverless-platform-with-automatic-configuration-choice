provider:
  name: openfaas
  gateway: a86c4b78326494ab19a31870a72e4bbb-1832185824.eu-west-2.elb.amazonaws.com:8080
functions:
  pigo-face-detector:
    lang: go
    handler: ./pigo-openfaas
    image: mbilalce/face-detection:latest
    environment:
      input_mode: url
      output_mode: image
      read_timeout: 600s
      write_timeout: 600s
      exec_timeout: 600s
    limits:
      memory: 128Mi
      cpu: 750m
    constraints:
    - beta.kubernetes.io/instance-type=c5a.large
