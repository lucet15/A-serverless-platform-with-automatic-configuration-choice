provider:
  name: openfaas
  gateway: ab0c147993145459d98abd5773deec1a-864082524.eu-west-2.elb.amazonaws.com:8080
functions:
  pigo-face-detector:
    lang: go
    handler: ./pigo-openfaas
    image: lucet/face-detection:t3
    environment:
      input_mode: url
      output_mode: image
      read_timeout: 600s
      write_timeout: 600s
      exec_timeout: 600s
    limits:
      memory: 3412Mi
      cpu: 1750m
    constraints:
    - beta.kubernetes.io/instance-type=t3.nano
