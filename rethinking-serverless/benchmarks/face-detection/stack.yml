provider:
  name: openfaas
  gateway: http://a3b54ff11545445bea9632f64596f423-1450083663.eu-west-2.elb.amazonaws.com:8080
functions:
  pigo-face-detector:
    lang: go
    handler: ./pigo-openfaas
    image: mbilalce/face-detection:latest
    environment:
      input_mode: url
      output_mode: image
      read_timeout: 600s
      write_timeout: 600s
      exec_timeout: 600s
    limits:
      memory: 128Mi
      cpu: 250m
    constraints:
    - beta.kubernetes.io/instance-type=m6g.large
