\version: 1.0
provider:
  name: openfaas
  gateway: http://afa49de75be884405914168c86482870-335240086.eu-west-2.elb.amazonaws.com:8080
functions:
  s3:
    lang: python3
    handler: ./s3
    image: mbilalce/openfaas-s3:latest
    environment:
      read_timeout: 600s
      write_timeout: 600s
      exec_timeout: 600s
    limits:
      memory: 768Mi
      cpu: 250m
    constraints:
    - beta.kubernetes.io/instance-type=c5a.large
