version: 1.0
provider:
  name: openfaas
  gateway: abe46901ccf614ff1a251dd21a360a71-456606304.eu-west-2.elb.amazonaws.com:8080
functions:
  s3-notime:
    lang: python3
    handler: ./s3
    image: mbilalce/openfaas-s3:latest
    environment:
      read_timeout: 600s
      write_timeout: 600s
      exec_timeout: 600s
    limits:
      memory: 2048Mi
      cpu: 2000m
    constraints:
    - beta.kubernetes.io/instance-type=m6g.xlarge
